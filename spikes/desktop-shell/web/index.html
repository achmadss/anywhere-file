<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>anywhere-file desktop shell spike</title>
    <style>
      body { font: 13px ui-monospace, Menlo, monospace; margin: 0; padding: 16px; background: #14161a; color: #dfe3e8; }
      h1 { font-size: 15px; margin: 0 0 12px; }
      .row { margin: 6px 0; }
      .k { color: #7d8590; }
      #eid { color: #7ee787; font-size: 14px; word-break: break-all; }
      button { font: inherit; background: #21262d; color: #dfe3e8; border: 1px solid #3d444d; border-radius: 5px; padding: 5px 10px; cursor: pointer; }
      pre { background: #0d1117; border: 1px solid #21262d; border-radius: 5px; padding: 8px; max-height: 300px; overflow: auto; margin: 6px 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>anywhere-file desktop shell spike (issue #4)</h1>
    <div class="row"><span class="k">iroh endpoint id:</span> <span id="eid">…</span></div>
    <div class="row"><span class="k">localhost streamer:</span> <span id="port">…</span></div>
    <div class="row"><span class="k">process rss:</span> <span id="rss">…</span></div>
    <div class="row">
      <button id="b-list">list dir</button>
      <button id="b-proto">stream via rfmfile:// (ranged)</button>
      <button id="b-http">stream via localhost</button>
    </div>
    <pre id="out">ready</pre>

    <script>
      const invoke = window.__TAURI_INTERNALS__.invoke;
      const out = document.getElementById("out");
      const log = (s) => { out.textContent = s + "\n" + out.textContent; };
      const q = new URLSearchParams(location.search);
      const GB = 1024 * 1024 * 1024;

      async function refresh() {
        document.getElementById("eid").textContent = await invoke("endpoint_id");
        document.getElementById("port").textContent = "127.0.0.1:" + (await invoke("http_port"));
        document.getElementById("rss").textContent = (await invoke("rss_kb")) + " KiB";
      }
      // A heartbeat off the same 1s timer, so the log shows whether the webview main
      // thread kept ticking while a transfer was in flight.
      let tick = 0;
      setInterval(() => { refresh(); if (++tick % 3 === 0) invoke("mark", { label: "ui-heartbeat", bytes: tick }); }, 1000);
      refresh();
      invoke("mark", { label: `webview-alive ua=${navigator.userAgent.slice(0, 40)} viewport=${innerWidth}x${innerHeight} dpr=${devicePixelRatio}`, bytes: 0 });

      async function listDir() {
        const dir = q.get("dir") || "/";
        const items = await invoke("list_dir", { path: dir });
        await invoke("mark", { label: `list_dir ${dir} -> ${items.length} entries`, bytes: 0 });
        log("list_dir " + dir + " -> " + items.length + " entries\n" +
            items.slice(0, 12).map(([n, s]) => "  " + n + "  " + s).join("\n"));
      }

      // macOS and Linux address a custom scheme as `<scheme>://localhost/`; Windows and
      // Android rewrite it to `http://<scheme>.localhost/` (tauri-2.11.5 webview/mod.rs:2388).
      const PROTO_URL = navigator.userAgent.includes("Windows")
        ? "http://rfmfile.localhost/big"
        : "rfmfile://localhost/big";

      // The uri-scheme responder takes a fully materialised Vec<u8> (tauri-2.11.5
      // app.rs:2462), so bulk transfer means many bounded ranges, never one big body.
      async function viaProtocol() {
        const CH = 8 * 1024 * 1024;
        let off = 0, total = null, mark = GB, t0 = performance.now();
        log("protocol: GET " + PROTO_URL);
        while (total === null || off < total) {
          const r = await fetch(PROTO_URL, { headers: { Range: `bytes=${off}-${off + CH - 1}` } });
          if (r.status !== 206 && r.status !== 200) { log("protocol: HTTP " + r.status); return; }
          const cr = r.headers.get("content-range");
          if (cr) total = parseInt(cr.split("/")[1], 10);
          const b = await r.arrayBuffer();
          if (b.byteLength === 0) break;
          off += b.byteLength;
          if (off >= mark) { mark += GB; await invoke("mark", { label: "protocol", bytes: off }); log(`protocol ${(off / GB).toFixed(2)} GiB`); }
        }
        const s = (performance.now() - t0) / 1000;
        await invoke("mark", { label: `protocol-done ${s.toFixed(1)}s ${(off / s / 1e6).toFixed(0)}MB/s`, bytes: off });
        log(`protocol done: ${off} bytes in ${s.toFixed(1)}s (${(off / s / 1e6).toFixed(0)} MB/s)`);
      }

      // One response body, drained through a ReadableStream reader, so neither side ever
      // holds more than its copy buffer.
      async function viaHttp() {
        const port = await invoke("http_port");
        const t0 = performance.now();
        const r = await fetch(`http://127.0.0.1:${port}/big`);
        const reader = r.body.getReader();
        let off = 0, mark = GB;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          off += value.byteLength;
          if (off >= mark) { mark += GB; await invoke("mark", { label: "http", bytes: off }); log(`http ${(off / GB).toFixed(2)} GiB`); }
        }
        const s = (performance.now() - t0) / 1000;
        await invoke("mark", { label: `http-done ${s.toFixed(1)}s ${(off / s / 1e6).toFixed(0)}MB/s`, bytes: off });
        log(`http done: ${off} bytes in ${s.toFixed(1)}s (${(off / s / 1e6).toFixed(0)} MB/s)`);
      }

      document.getElementById("b-list").onclick = () => listDir().catch((e) => log("list error: " + e));
      document.getElementById("b-proto").onclick = () => viaProtocol().catch((e) => log("protocol error: " + e));
      document.getElementById("b-http").onclick = () => viaHttp().catch((e) => log("http error: " + e));

      // `?run=list,http,proto` makes the whole thing scriptable from a terminal.
      (async () => {
        // One unranged GET. With SPIKE_NO_CAP set on the Rust side this is the
        // counterfactual: the whole file in one response body.
        const protoraw = async () => {
          const t0 = performance.now();
          const r = await fetch(PROTO_URL);
          const b = await r.arrayBuffer();
          const s = (performance.now() - t0) / 1000;
          await invoke("mark", { label: `protoraw-done ${s.toFixed(1)}s`, bytes: b.byteLength });
          log(`protoraw done: ${b.byteLength} bytes in ${s.toFixed(1)}s`);
        };
        const steps = { list: listDir, http: viaHttp, proto: viaProtocol, protoraw };
        for (const name of (q.get("run") || "").split(",").filter(Boolean)) {
          try { await steps[name](); } catch (e) { log(name + " error: " + e); }
        }
        if (q.has("run")) await invoke("mark", { label: "autorun-finished", bytes: 0 });
      })();
    </script>
  </body>
</html>
