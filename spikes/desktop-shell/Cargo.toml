# Throwaway spike crate for issue #4. Its own [workspace] key keeps Tauri and iroh
# out of the root `cargo build --workspace`.
[workspace]

[package]
name = "desktop-shell-spike"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync"] }
iroh = "1.2"

[[bin]]
name = "shell"
path = "src/main.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
