# Throwaway: spike #2 only. Not a workspace member, not built by CI, delete once the
# spike's conclusions land in core/.
[package]
name = "spike-keystore"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately its own workspace so `cargo build --workspace` at the repo root does not
# pull iroh into the tree. core/ has no dependencies yet on purpose.
[workspace]

[dependencies]
iroh = "1.2.0"
tokio = { version = "1", features = ["full"] }

# keyring 3 ships no platform backend unless a feature asks for one. Without a *-native
# feature it falls back to an in-process mock store that "works" and persists nothing.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

chacha20poly1305 = "0.10"
data-encoding = "2"
