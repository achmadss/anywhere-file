name: release

# A version tag makes a release (#138). Each runner builds the package for its own OS from
# packaging/, because the pkg needs macOS and the MSI needs Windows, and one last job
# attaches all of them to a GitHub release under the tag. The package job in ci.yml keeps
# proving that a package installs; this one only publishes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: build the package for this OS
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          case "$RUNNER_OS" in
            Linux) packaging/linux/build.sh ;;
            macOS) packaging/macos/build.sh ;;
            Windows) packaging/windows/build.sh ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: attach the packages to a release under the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
