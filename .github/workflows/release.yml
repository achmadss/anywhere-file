name: release

# A version tag makes a release (#138). Each runner builds the package for its own OS from
# packaging/, because the pkg needs macOS and the MSI needs Windows, and one last job
# attaches all of them to a GitHub release under the tag. The package job in ci.yml keeps
# proving that a package installs; this one only publishes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    # Nothing is published from a commit that fails CI. The tag push sends no list of
    # changed files, so the changes job in ci.yml runs every job.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read

  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
      - name: build the package for this OS
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          case "$RUNNER_OS" in
            Linux) packaging/linux/build.sh ;;
            macOS) packaging/macos/build.sh ;;
            Windows) packaging/windows/build.sh ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: attach the packages to a release under the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
