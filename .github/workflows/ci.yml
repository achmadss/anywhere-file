name: ci

on:
  push:
    branches: [main]
  pull_request:

# One workflow rather than four, because branch protection needs a single check that is
# always reported. Path-filtered workflows cannot do that: a PR touching only TypeScript
# never reports the Rust check, so a required Rust check would block it forever. Here the
# `changes` job always runs, the language jobs skip, and `ci-ok` is always reported.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      spikes: ${{ steps.filter.outputs.spikes }}
      go: ${{ steps.filter.outputs.go }}
      ts: ${{ steps.filter.outputs.ts }}
      relay: ${{ steps.filter.outputs.relay }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$base"...HEAD)
          else
            files=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || git ls-files)
          fi
          echo "changed files:"; echo "$files"

          match() { echo "$files" | grep -qE "$1"; }
          m() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi; } >> "$GITHUB_OUTPUT"

          m rust  '^(device/core/|device/agent/|Cargo\.(toml|lock)$|rustfmt\.toml$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          m go    '^(hosted/control-plane/|\.github/workflows/ci\.yml$)'
          m ts    '^(device/ui/|hosted/console/|hosted/dashboard/|package(-lock)?\.json$|tsconfig\.base\.json$|\.nvmrc$|\.github/workflows/ci\.yml$)'
          m relay '^(hosted/relay/|\.github/workflows/ci\.yml$)'
          m spikes '^(spikes/|\.github/workflows/ci\.yml$)'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Three runners, because the device key store is a different implementation on each
    # (#6) and the path jail will be too (#13). A cfg-gated branch that nothing compiles
    # is a branch that nothing checks, and it rots silently until someone opens a laptop
    # running the other OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; rustup honours it on first cargo call.
      - uses: Swatinem/rust-cache@v2
      # Formatting has no per-OS answer, so it is checked once.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted/control-plane
    # The control plane's tests are about PostgreSQL constraints and about what PostgreSQL
    # does when two transactions race for one. Without a database they skip, and skipping is
    # indistinguishable from passing in a green tick, so CI runs a real one.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rfm
          POSTGRES_PASSWORD: rfm
          POSTGRES_DB: rfm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfm -d rfm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      RFM_TEST_DATABASE_URL: postgres://rfm:rfm@localhost:5432/rfm?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: hosted/control-plane/go.mod
          cache-dependency-path: hosted/control-plane/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./...
      # A skipped test reports as a pass. Fail the job if the database tests did not run.
      - run: go test -run TestConcurrentAssociationsLeaveExactlyOneRow -v ./... | tee /tmp/race.log
      - run: "grep -q -- '--- PASS: TestConcurrentAssociationsLeaveExactlyOneRow' /tmp/race.log"

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Proves the pinned tag still exists and our patches still apply. It does not build
      # iroh-relay, which is minutes of compile for a check that adds nothing until the
      # patch does something (#46, #30).
      - run: hosted/relay/apply.sh
      # hosted/relay/fleet is its own workspace, so the root cargo fmt/clippy/test do
      # not see it. It gets the same treatment here.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hosted/relay/fleet
      - run: cargo fmt --manifest-path hosted/relay/fleet/Cargo.toml --all --check
      - run: cargo clippy --manifest-path hosted/relay/fleet/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path hosted/relay/fleet/Cargo.toml
      # Rendered configs must stay valid TOML with the fields #28 requires.
      - run: hosted/relay/deploy/render-config.sh hosted/relay/deploy/regions/eu-west.env.example > /dev/null
      - run: hosted/relay/deploy/render-config.sh hosted/relay/deploy/regions/ap-southeast.env.example > /dev/null
      - run: bash -n hosted/relay/deploy/render-config.sh hosted/relay/deploy/provision.sh hosted/relay/deploy/capacity/bench.sh

  spikes:
    needs: changes
    if: needs.changes.outputs.spikes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Spike crates each declare their own [workspace] so the root `cargo build
      # --workspace` does not pull iroh or Tauri into every Rust run. That also puts them
      # outside root `cargo fmt --all`, so they get formatted here instead. Only formatting:
      # clippy would mean a full iroh build for throwaway code that is deleted once the
      # spike's conclusions land.
      - name: rustfmt every spike crate and loose .rs file
        run: |
          shopt -s nullglob
          found=0
          for manifest in spikes/*/Cargo.toml; do
            echo "== $(dirname "$manifest")"
            (cd "$(dirname "$manifest")" && cargo fmt --all --check)
            found=1
          done
          for stray in spikes/*/*.rs; do
            echo "== $stray"
            rustfmt --edition 2024 --check "$stray"
            found=1
          done
          if [ "$found" = 0 ]; then echo "no spike crates"; fi

  prose:
    # AGENTS.md bans em and en dashes in anything a person reads. A rule with no check is a
    # rule that comes back one PR at a time, so this is the check. Generated and vendored
    # files are exempt because we do not write them; -I skips binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: no em or en dashes
        run: |
          if git grep -nPI '[\x{2013}\x{2014}]' -- . \
               ':!package-lock.json' ':!Cargo.lock' ':!hosted/relay/fleet/Cargo.lock' \
               ':!hosted/relay/patches'; then
            echo
            echo "Em and en dashes are banned (AGENTS.md). Use a period, comma, colon or parentheses."
            exit 1
          fi

  blockers:
    # Issue dependencies are advisory in GitHub's UI: it shows what an issue waits on and
    # then lets you close it anyway. This is where they bite. Only a pull request carries
    # `closingIssuesReferences`, so there is nothing to check on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/check-blockers.sh "$GITHUB_REPOSITORY" "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}

  ci-ok:
    # The one check branch protection requires. Green when every job that ran passed, and
    # when a job was skipped because nothing in its language changed.
    needs: [changes, rust, go, ts, relay, spikes, blockers, prose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"'; then
            echo "a required job failed"; exit 1
          fi
          echo "ok"
