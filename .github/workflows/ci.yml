name: ci

on:
  push:
    branches: [main]
  pull_request:

# One workflow rather than several, because branch protection needs a single check that is
# always reported. Path-filtered workflows cannot do that: a PR touching only docs never
# reports the Go check, so a required Go check would block it forever. Here the `changes`
# job always runs, the language jobs skip, and `ci-ok` is always reported.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$base"...HEAD)
          else
            files=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || git ls-files)
          fi
          echo "changed files:"; echo "$files"

          match() { echo "$files" | grep -qE "$1"; }
          m() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi; } >> "$GITHUB_OUTPUT"

          m go '^(go\.(mod|sum)$|\.gitattributes$|hosted/control-plane/|device/agent/|internal/|\.github/workflows/ci\.yml$)'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # Three runners because the agent's keystore is a different implementation on each OS,
    # and a branch nothing compiles is a branch nothing checks. The PostgreSQL tests run on
    # ubuntu only, where a container is one command away.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The control plane's tests are about PostgreSQL constraints and about what PostgreSQL
      # does when two transactions race for one. Without a database they skip, and skipping
      # is indistinguishable from passing in a green tick, so ubuntu runs a real one.
      - if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=rfm -e POSTGRES_PASSWORD=rfm -e POSTGRES_DB=rfm postgres:18-alpine
          for i in $(seq 30); do docker exec pg pg_isready -U rfm -d rfm && break; sleep 2; done
          echo "RFM_TEST_DATABASE_URL=postgres://rfm:rfm@localhost:5432/rfm?sslmode=disable" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./...
      # A skipped test reports as a pass. Fail the job if the database tests did not run.
      - if: runner.os == 'Linux'
        run: go test -run TestConcurrentInviteRedeemsConsumeOnce -v ./hosted/control-plane/ | tee race.log
      - if: runner.os == 'Linux'
        run: "grep -q -- '--- PASS: TestConcurrentInviteRedeemsConsumeOnce' race.log"

  prose:
    # AGENTS.md bans em and en dashes in anything a person reads. A rule with no check is a
    # rule that comes back one PR at a time, so this is the check. -I skips binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: no em or en dashes
        run: |
          if git grep -nPI '[\x{2013}\x{2014}]' -- . ; then
            echo
            echo "Em and en dashes are banned (AGENTS.md). Use a period, comma, colon or parentheses."
            exit 1
          fi

  blockers:
    # Issue dependencies are advisory in GitHub's UI: it shows what an issue waits on and
    # then lets you close it anyway. This is where they bite. Only a pull request carries
    # `closingIssuesReferences`, so there is nothing to check on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/check-blockers.sh "$GITHUB_REPOSITORY" "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}

  ci-ok:
    # The one check branch protection requires. Green when every job that ran passed, and
    # when a job was skipped because nothing in its language changed.
    needs: [changes, go, blockers, prose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"'; then
            echo "a required job failed"; exit 1
          fi
          echo "ok"
