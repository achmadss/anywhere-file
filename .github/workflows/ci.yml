name: ci

on:
  push:
    branches: [main]
  pull_request:

# One workflow rather than several, because branch protection needs a single check that is
# always reported. Path-filtered workflows cannot do that: a PR touching only docs never
# reports the Go check, so a required Go check would block it forever. Here the `changes`
# job always runs, the language jobs skip, and `ci-ok` is always reported.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$base"...HEAD)
          else
            files=$(git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null || git ls-files)
          fi
          echo "changed files:"; echo "$files"

          match() { echo "$files" | grep -qE "$1"; }
          m() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi; } >> "$GITHUB_OUTPUT"

          m go '^(go\.(mod|sum)$|\.gitattributes$|hosted/control-plane/|device/agent/|internal/|qa/|\.github/(scripts/|workflows/ci\.yml$))'
          m rules '^(hosted/control-plane/(rules|alertmanager)\.yml$|\.github/workflows/ci\.yml$)'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # Three runners because the agent's keystore is a different implementation on each OS,
    # and a branch nothing compiles is a branch nothing checks. The PostgreSQL tests run on
    # ubuntu only, where a container is one command away.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The control plane's tests are about PostgreSQL constraints and about what PostgreSQL
      # does when two transactions race for one. Without a database they skip, and skipping
      # is indistinguishable from passing in a green tick, so ubuntu runs a real one.
      - if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=rfm -e POSTGRES_PASSWORD=rfm -e POSTGRES_DB=rfm postgres:18-alpine
          for i in $(seq 30); do docker exec pg pg_isready -U rfm -d rfm && break; sleep 2; done
          echo "RFM_TEST_DATABASE_URL=postgres://rfm:rfm@localhost:5432/rfm?sslmode=disable" >> "$GITHUB_ENV"
      # The hosted macOS runner cannot send to the multicast group at all and the Windows
      # one hears no answer, so the mDNS resolution test runs on Linux. Every runner still
      # checks that the responder binds 5353 beside the one its OS already runs.
      - if: runner.os == 'Linux'
        run: echo "RFM_TEST_MULTICAST=1" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test ./...
      # A skipped test reports as a pass. Fail the job if the database tests did not run.
      - if: runner.os == 'Linux'
        run: go test -run TestConcurrentInviteRedeemsConsumeOnce -v ./hosted/control-plane/ | tee race.log
      - if: runner.os == 'Linux'
        run: "grep -q -- '--- PASS: TestConcurrentInviteRedeemsConsumeOnce' race.log"
      # Same reason: prove the mDNS resolution test ran rather than skipped.
      - if: runner.os == 'Linux'
        run: go test -run TestTheAdvertisedRecordIsFound -v ./device/agent/ | tee mdns.log
      - if: runner.os == 'Linux'
        run: "grep -q -- '--- PASS: TestTheAdvertisedRecordIsFound' mdns.log"
      # The last acceptance case of #93: two hosts that can reach each other and nothing
      # else find each other. Containers on a Docker internal network are that.
      - name: discovery between two containers on a network with no route off it
        if: runner.os == 'Linux'
        run: .github/scripts/mdns-containers.sh

  service:
    # #33's acceptance: the OS starts the agent and keeps it, with nothing typed into a
    # window. A runner cannot be rebooted, so what is checked here is that the manifest
    # installs, the service comes up on its own, and uninstalling takes it away again.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # No multicast and no server on a runner, and the keystore has no unlocked session
      # behind it, so the service gets the settings that leave only the gateway.
      RFM_AGENT_ADDR: 127.0.0.1:7433
      RFM_AGENT_MDNS: "off"
      RFM_AGENT_TUNNEL: "off"
      RFM_AGENT_KEYSTORE: file
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: build
        run: |
          agent="$RUNNER_TEMP/agent"
          [ "$RUNNER_OS" = Windows ] && agent="$agent.exe"
          go build -o "$agent" ./device/agent
          echo "AGENT=$agent" >> "$GITHUB_ENV"
      # A systemd user manager exists on the runner only once the user lingers, and it is
      # reached through XDG_RUNTIME_DIR. On a desktop both are already true.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: install
        run: |
          "$AGENT" install
      - name: the service answers on its own
        run: .github/scripts/service-up.sh up
      # #96: the certificate on the LAN is the one the device key signed, so a client that
      # knows a device id can tell whether it is talking to that PC.
      - name: the device key signed the certificate
        if: runner.os == 'Linux'
        run: .github/scripts/lan-tls.sh
      - name: uninstall
        run: |
          "$AGENT" uninstall
      - name: and stops answering
        run: .github/scripts/service-up.sh down

  dufs:
    # #92's acceptance, which needs the application itself: the agent starts dufs, the
    # gateway serves it, and dufs is reachable through the gateway and nowhere else. One
    # runner, because what is checked here is the agent's behaviour and not dufs's.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      RFM_AGENT_ADDR: 127.0.0.1:7433
      RFM_AGENT_MDNS: "off"
      RFM_AGENT_TUNNEL: "off"
      RFM_AGENT_KEYSTORE: file
      DUFS_VERSION: 0.46.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Downloaded here, shipped with the agent on a customer's PC (#124).
      - name: dufs
        run: |
          name="dufs-v${DUFS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLo dufs.tar.gz "https://github.com/sigoden/dufs/releases/download/v${DUFS_VERSION}/${name}"
          tar xzf dufs.tar.gz dufs
          echo "$PWD" >> "$GITHUB_PATH"
      - name: build
        run: |
          go build -o "$RUNNER_TEMP/agent" ./device/agent
          echo "AGENT=$RUNNER_TEMP/agent" >> "$GITHUB_ENV"
      - name: a file through the gateway, and dufs restarted under it
        run: .github/scripts/dufs-through-the-gateway.sh

  e2e:
    # #40's table, one test per row. Everything in it is a real process: the control plane
    # on PostgreSQL, the agent, dufs, and a switchboard the harness cuts to take the PC off
    # the Internet. One runner, because what is under test is the network between them.
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      DUFS_VERSION: 0.46.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: postgres
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=rfm -e POSTGRES_PASSWORD=rfm -e POSTGRES_DB=rfm postgres:18-alpine
          for i in $(seq 30); do docker exec pg pg_isready -U rfm -d rfm && break; sleep 2; done
          echo "RFM_E2E_DATABASE_URL=postgres://rfm:rfm@localhost:5432/rfm?sslmode=disable" >> "$GITHUB_ENV"
      - name: dufs
        run: |
          name="dufs-v${DUFS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLo dufs.tar.gz "https://github.com/sigoden/dufs/releases/download/v${DUFS_VERSION}/${name}"
          tar xzf dufs.tar.gz dufs
          echo "$PWD" >> "$GITHUB_PATH"
      - name: the failure table
        run: .github/scripts/failure-suite.sh

  rules:
    # promtool is Prometheus's own rule checker: it parses every expression, which the Go
    # test cannot do. It runs only when the rules change, because it costs a release
    # download.
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.14.0
    steps:
      - uses: actions/checkout@v5
      - run: |
          dir="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -sSLo prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${dir}.tar.gz"
          tar xzf prometheus.tar.gz --strip-components=1 "${dir}/promtool"
          ./promtool check rules hosted/control-plane/rules.yml

  prose:
    # AGENTS.md bans em and en dashes in anything a person reads. A rule with no check is a
    # rule that comes back one PR at a time, so this is the check. -I skips binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: no em or en dashes
        run: |
          if git grep -nPI '[\x{2013}\x{2014}]' -- . ; then
            echo
            echo "Em and en dashes are banned (AGENTS.md). Use a period, comma, colon or parentheses."
            exit 1
          fi

  blockers:
    # Issue dependencies are advisory in GitHub's UI: it shows what an issue waits on and
    # then lets you close it anyway. This is where they bite. Only a pull request carries
    # `closingIssuesReferences`, so there is nothing to check on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: .github/scripts/check-blockers.sh "$GITHUB_REPOSITORY" "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}

  ci-ok:
    # The one check branch protection requires. Green when every job that ran passed, and
    # when a job was skipped because nothing in its language changed.
    needs: [changes, go, service, dufs, e2e, rules, blockers, prose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"'; then
            echo "a required job failed"; exit 1
          fi
          echo "ok"
