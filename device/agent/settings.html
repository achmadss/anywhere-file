<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Device}} settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 42rem; padding: 2rem 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
  p.sub { color: GrayText; margin: 0 0 1rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { align-items: center; border-bottom: 1px solid ButtonBorder; display: flex; gap: .75rem; padding: .5rem 0; }
  li .grow { flex: 1; min-width: 0; }
  li .path { color: GrayText; font-size: .85rem; overflow-wrap: anywhere; }
  button { border: 1px solid ButtonBorder; border-radius: .35rem; background: ButtonFace; color: ButtonText;
           cursor: pointer; font: inherit; padding: .3rem .7rem; }
  button.link { background: none; border: 0; padding: .3rem 0; text-align: left; }
  #here { font-size: .9rem; overflow-wrap: anywhere; }
  #error { color: #b00; min-height: 1.5rem; }
  input { border: 1px solid ButtonBorder; border-radius: .35rem; font: inherit; padding: .3rem .5rem; }
</style>

<h1>{{.Device}}</h1>
<p class="sub">Folders on this PC that you can reach from anywhere.</p>
<p id="error"></p>

<h2>Shared now</h2>
<ul id="shares"></ul>

<h2>Add a folder</h2>
<p id="here"></p>
<ul id="dirs"></ul>
<p>
  <label>Call it <input id="name" placeholder="optional" size="14"></label>
  <button id="share">Share this folder</button>
</p>

<h2>Account</h2>
<p id="account"></p>
<p id="approve" hidden>Approve this PC at <a id="approve-url" target="_blank" rel="noreferrer"></a>,
  where the code is <b id="approve-code"></b>.</p>
<p>
  <label id="server-box">Server <input id="server" placeholder="https://" size="22"></label>
  <button id="signin">Sign in</button>
  <button id="signout">Sign out</button>
</p>

<script>
const token = "{{.Token}}";
const home = "{{.Home}}";
let here = home;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.statusText);
  return out;
}

function show(err) { document.getElementById("error").textContent = err ? String(err.message || err) : ""; }

function row(children) {
  const li = document.createElement("li");
  for (const c of children) li.append(c);
  return li;
}

function text(cls, s) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = s;
  return d;
}

function drawShares(apps) {
  const ul = document.getElementById("shares");
  ul.replaceChildren();
  if (apps.length === 0) {
    ul.append(row([text("grow", "Nothing yet. Pick a folder below.")]));
    return;
  }
  for (const a of apps) {
    const grow = document.createElement("div");
    grow.className = "grow";
    grow.append(text("", a.name), text("path", a.path || a.address));
    const remove = document.createElement("button");
    remove.textContent = "Stop sharing";
    remove.onclick = async () => {
      show(null);
      try { drawShares((await api("DELETE", "/v1/apps/" + encodeURIComponent(a.name))).apps); }
      catch (e) { show(e); }
    };
    ul.append(row([grow, remove]));
  }
}

function link(label, onclick) {
  const b = document.createElement("button");
  b.className = "link grow";
  b.textContent = label;
  b.onclick = onclick;
  return b;
}

async function go(path) {
  show(null);
  try {
    const out = await api("GET", "/v1/browse?path=" + encodeURIComponent(path || ""));
    here = out.path;
    document.getElementById("here").textContent = out.path;
    const ul = document.getElementById("dirs");
    ul.replaceChildren();
    if (out.parent) ul.append(row([link("↑ " + out.parent, () => go(out.parent))]));
    for (const d of out.dirs) ul.append(row([link(d, () => go(out.path + "/" + d))]));
  } catch (e) { show(e); }
}

document.getElementById("share").onclick = async () => {
  show(null);
  const name = document.getElementById("name");
  try {
    await api("POST", "/v1/apps", {path: here, name: name.value.trim()});
    name.value = "";
    drawShares((await api("GET", "/v1/apps")).apps);
  } catch (e) { show(e); }
};

function drawAccount(acc) {
  const waiting = acc.login.waiting;
  document.getElementById("account").textContent = acc.enrolled
    ? "This PC belongs to the account at " + acc.server + ", as device " + acc.device_id + "."
    : "This PC belongs to no account. Folders above are shared on the LAN either way.";
  const approve = document.getElementById("approve");
  approve.hidden = !waiting;
  if (waiting) {
    const link = document.getElementById("approve-url");
    link.href = acc.login.url;
    link.textContent = acc.login.url;
    document.getElementById("approve-code").textContent = acc.login.code;
  }
  if (acc.login.error) show(acc.login.error);
  document.getElementById("server-box").hidden = acc.enrolled || waiting;
  document.getElementById("signin").hidden = acc.enrolled || waiting;
  document.getElementById("signout").hidden = !acc.enrolled;
  // Approving happens somewhere else, so the page asks how it went until it knows.
  if (waiting) setTimeout(() => api("GET", "/v1/account").then(drawAccount).catch(show), 2000);
}

document.getElementById("signin").onclick = async () => {
  show(null);
  try {
    const acc = await api("POST", "/v1/account/login", {server: document.getElementById("server").value.trim()});
    drawAccount(acc);
    if (acc.login.url) window.open(acc.login.url, "_blank");
  } catch (e) { show(e); }
};

document.getElementById("signout").onclick = async () => {
  show(null);
  try { drawAccount(await api("POST", "/v1/account/logout", {})); }
  catch (e) { show(e); }
};

api("GET", "/v1/apps").then(out => drawShares(out.apps)).catch(show);
api("GET", "/v1/account").then(drawAccount).catch(show);
go(home);
</script>
