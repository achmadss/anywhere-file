{{define "style"}}<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 26rem; padding: 3rem 1rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p.sub { color: GrayText; margin: 0 0 1.5rem; }
  label { display: block; margin: 0 0 1rem; }
  input { border: 1px solid ButtonBorder; border-radius: .35rem; box-sizing: border-box;
          font: inherit; padding: .4rem .5rem; width: 100%; }
  button { border: 1px solid ButtonBorder; border-radius: .35rem; background: ButtonFace; color: ButtonText;
           cursor: pointer; font: inherit; margin: 0 .5rem 0 0; padding: .4rem 1rem; }
  button.deny { color: GrayText; }
  #message { min-height: 1.5rem; }
  #message.bad { color: #b00; }
</style>{{end}}
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
{{template "style"}}

<h1>{{.Title}}</h1>
{{if .Intro}}<p class="sub">{{.Intro}}</p>{{end}}

<form id="form">
  {{range .Fields}}
  <label>{{.Label}}
    <input name="{{.Name}}" type="{{.Type}}" autocomplete="{{.Auto}}">
  </label>
  {{end}}
  {{if .Submit}}<button {{if .Deny}}value="approve"{{end}}>{{.Submit}}</button>{{end}}
  {{if .Deny}}<button class="deny" value="refuse">{{.Deny}}</button>{{end}}
</form>
<p id="message"></p>

<script>
const action = "{{.Action}}";
const done = "{{.Done}}";
const onLoad = {{.OnLoad}};
const reload = {{.Reload}};
const form = document.getElementById("form");
const message = document.getElementById("message");

function say(text, bad) {
  message.textContent = text;
  message.className = bad ? "bad" : "";
}

async function submit(pressed) {
  const body = {};
  for (const el of form.elements) if (el.name) body[el.name] = el.value;
  const query = new URLSearchParams(location.search);
  for (const key of ["token", "code"]) {
    const value = query.get(key);
    if (value) body[key] = value;
  }
  // The buttons carry no name, so the loop above skips them and only the one that was
  // pressed says what the answer was.
  if (pressed && pressed.value) body.approve = pressed.value === "approve";

  say("");
  let res, out;
  try {
    res = await fetch(action, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    out = await res.json();
  } catch (e) {
    say("The server did not answer. Try again.", true);
    return;
  }
  if (!res.ok) {
    say(out.error || res.statusText, true);
    return;
  }
  if (reload) {
    location.reload();
    return;
  }
  form.hidden = true;
  say(out.message || done);
}

form.addEventListener("submit", (e) => { e.preventDefault(); submit(e.submitter); });
if (onLoad) submit();
</script>
