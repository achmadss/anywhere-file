# Alertmanager routing for the control plane.
# Alertmanager owns routing, grouping, silences, and escalation. Nothing in the
# control plane reimplements any of that.
#
# Silences are runtime state, made through the Alertmanager API or UI during
# deploys and incidents. They are not stored in this file.
#
# Receiver endpoints below are placeholders. Point webhook_url at the paging
# service and smtp_smarthost at the mail relay during provisioning (#28).

global:
  resolve_timeout: 5m

route:
  receiver: team-ops
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical pages someone now, then nags every half hour until resolved.
    - matchers:
        - severity = "critical"
      receiver: paging
      repeat_interval: 30m
    # Fleet capacity warnings go to the same channel as everything else but
    # repeat daily: they clear only when someone provisions.
    - matchers:
        - alertname =~ "RelayThroughputNearCapacity|RelayCommittedOverRatio"
      repeat_interval: 24h

receivers:
  - name: team-ops
    email_configs:
      - to: "ops@example.com"
        send_resolved: true
  - name: paging
    webhook_configs:
      - url: "https://paging.example.com/hook"
        send_resolved: true

inhibit_rules:
  # A missing scrape explains every other relay symptom; page on the cause.
  - source_matchers:
      - alertname = "RelayMetricsMissing"
    target_matchers:
      - alertname =~ "RelayThroughputNearCapacity|RelayCommittedOverRatio|RelayDenialSpike"
    equal: []
