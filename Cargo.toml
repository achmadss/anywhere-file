[workspace]
resolver = "3"
members = ["core", "agent"]

# relay/ is deliberately not a member: it is pinned upstream source plus our diff,
# fetched on demand by relay/apply.sh. See relay/README.md.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Pinned exactly: iroh is the transport and a patch bump is a deliberate act, not a
# `cargo update`. relay/IROH_VERSION pins the relay to the same release.
getrandom = "0.4"
iroh = "=1.2.0"
# keyring 3 rather than 4: spike #2 measured 3.6 end to end on macOS, and 4 is a
# rewrite into per-store crates that nothing here has run.
keyring = "3.6"
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0.1"
windows-dpapi = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Warnings fail CI (`-D warnings`); this is the floor everything is held to.
all = { level = "warn", priority = -1 }
