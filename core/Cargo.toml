[package]
name = "rfm-core"
description = "Trust list, shares, access rule, file protocol, and transport."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cap-std = { workspace = true }
getrandom = { workspace = true }
iroh = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tracing = { workspace = true }

# keyring ships no backend unless a feature asks for one; without one it falls back to
# an in-process mock that accepts every write and forgets it. These flags are load-bearing.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# crypto-rust keeps the session encryption in Rust, vendored builds libdbus rather than
# needing the distro's -dev package on every build machine.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-dpapi = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
